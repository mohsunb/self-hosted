apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
 name: letsencrypt-dns01-issuer
spec:
 acme:
   email: mohsun.babayev@protonmail.com
   server: https://acme-v02.api.letsencrypt.org/directory
   privateKeySecretRef:
     name: issuer-account-key
   solvers:
     - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: dns01-issuer-api-token
            key: cloudflare-token
