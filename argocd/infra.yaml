apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infra
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://forge.mohsun.az/mohsunb/self-hosted.git
        revision: development
        files:
          - path: argocd/infra/*/argocd.json
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://forge.mohsun.az/mohsunb/self-hosted.git
        targetRevision: development
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        syncOptions:
          - ServerSideApply={{dig "serverSideApply" false .}}
        automated:
          enabled: true
