apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
  project: default
  source:
    path: argocd/cert-manager
    repoURL: https://forge.mohsun.az/mohsunb/self-hosted.git
    targetRevision: main
  syncPolicy:
    automated:
      enabled: true
