apiVersion: v1
kind: Service
metadata:
  name: valkey-sentinel
  namespace: forgejo
spec:
  selector:
    app: valkey-sentinel
  ports:
    - port: 26379
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-sentinel-headless
  namespace: forgejo
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: valkey-sentinel
  ports:
    - port: 26379
