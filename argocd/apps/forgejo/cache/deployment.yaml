apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: forgejo
spec:
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9.0.3
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey
                  key: password
          command:
            - valkey-server
            - --requirepass
            - $(VALKEY_PASSWORD)
          ports:
            - containerPort: 6379
          startupProbe:
            exec:
              command:
                - valkey-cli
                - --pass
                - $(VALKEY_PASSWORD)
                - ping
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - valkey-cli
                - --pass
                - $(VALKEY_PASSWORD)
                - ping
            periodSeconds: 10
            failureThreshold: 3
