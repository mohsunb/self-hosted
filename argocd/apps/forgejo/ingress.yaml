apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: upgrade-scheme
  namespace: forgejo
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: forgejo-http
  namespace: forgejo
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`forge.mohsun.az`)
      services:
        - name: forgejo-http
          port: 3000
      middlewares:
        - name: upgrade-scheme
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: forgejo-https
  namespace: forgejo
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`forge.mohsun.az`)
      services:
        - name: forgejo-http
          port: 3000
  tls:
    certResolver: default
