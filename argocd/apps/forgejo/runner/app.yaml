apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo-runner
  namespace: argocd
spec:
  project: default
  source:
    chart: forgejo-runner
    repoURL: codeberg.org/wrenix/helm-charts
    targetRevision: 0.7.6
    helm:
      releaseName: forgejo-runner
      valuesObject:
        knownLastVersion: true
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo
  syncPolicy:
    automated:
      enabled: true
