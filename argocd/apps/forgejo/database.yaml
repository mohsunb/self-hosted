apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: database
  namespace: forgejo
spec:
  instances: 2
  storage:
    size: 64Mi
  walStorage:
    size: 64Mi
  affinity:
    podAntiAffinityType: required
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: database
  namespace: forgejo
spec:
  schedule: "0 */5 * * * *"
  backupOwnerReference: self
  cluster:
    name: database
    method: volumeSnapshot
