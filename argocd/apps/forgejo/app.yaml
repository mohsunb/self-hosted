apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo-app
  namespace: argocd
spec:
  project: default
  source:
    chart: forgejo
    repoURL: code.forgejo.org/forgejo-helm
    targetRevision: 17.3.2
    helm:
      releaseName: forgejo
      valuesObject:
        strategy:
          type: RollingUpdate
        service:
          ssh:
            type: LoadBalancer
        gitea:
          config:
            database:
              DB_TYPE: postgres
            queue:
              TYPE: redis
            cache:
              ADAPTER: redis
            session:
              PROVIDER: redis
            server:
              DOMAIN: forgejo.test.mohsun.az
              ROOT_URL: http://forgejo.test.mohsun.az
              SSH_DOMAIN: forgejo.test.mohsun.az
          additionalConfigFromEnvs:
            - name: FORGEJO__DATABASE__HOST
              valueFrom:
                secretKeyRef:
                  name: database-app
                  key: host
            - name: FORGEJO__DATABASE__NAME
              valueFrom:
                secretKeyRef:
                  name: database-app
                  key: dbname
            - name: FORGEJO__DATABASE__USER
              valueFrom:
                secretKeyRef:
                  name: database-app
                  key: user
            - name: FORGEJO__DATABASE__PASSWD
              valueFrom:
                secretKeyRef:
                  name: database-app
                  key: password
            - name: FORGEJO__QUEUE__CONN_STR
              valueFrom:
                secretKeyRef:
                  name: valkey
                  key: conn-str-db0
            - name: FORGEJO__CACHE__HOST
              valueFrom:
                secretKeyRef:
                  name: valkey
                  key: conn-str-db1
            - name: FORGEJO__SESSION__PROVIDER_CONFIG
              valueFrom:
                secretKeyRef:
                  name: valkey
                  key: conn-str-db2
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo
  syncPolicy:
    automated:
      enabled: true
