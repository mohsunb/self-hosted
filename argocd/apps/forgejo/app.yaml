apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo-app
  namespace: argocd
spec:
  project: default
  source:
    chart: forgejo
    repoURL: code.forgejo.org/forgejo-helm
    targetRevision: 17.3.2
    helm:
      releaseName: forgejo
      valuesObject:
        replicaCount: 2
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: forgejo
        podDisruptionBudget:
          minAvailable: 1
        persistence:
          accessModes: ["ReadWriteMany"]
        httpRoute:
          enabled: true
          parentRefs:
            - name: default
              namespace: kube-system
          hostnames: ["forgejo.test.mohsun.az"]
          terminate: false
        tcpRoute:
          enabled: true
          parentRefs:
            - name: default
              namespace: kube-system
        gitea:
          config:
            database:
              DB_TYPE: postgres
            queue:
              TYPE: redis
            cache:
              ADAPTER: redis
            session:
              PROVIDER: redis
          additionalConfigFromEnvs:
            - name: FORGEJO__DATABASE__HOST
              valueFrom:
                secretKeyRef:
                  name: database-app
                  key: host
            - name: FORGEJO__DATABASE__NAME
              valueFrom:
                secretKeyRef:
                  name: database-app
                  key: dbname
            - name: FORGEJO__DATABASE__USER
              valueFrom:
                secretKeyRef:
                  name: database-app
                  key: user
            - name: FORGEJO__DATABASE__PASSWD
              valueFrom:
                secretKeyRef:
                  name: database-app
                  key: password
            - name: FORGEJO__QUEUE__CONN_STR
              valueFrom:
                secretKeyRef:
                  name: valkey
                  key: conn-str-db0
            - name: FORGEJO__CACHE__HOST
              valueFrom:
                secretKeyRef:
                  name: valkey
                  key: conn-str-db1
            - name: FORGEJO__SESSION__PROVIDER_CONFIG
              valueFrom:
                secretKeyRef:
                  name: valkey
                  key: conn-str-db2
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo
  syncPolicy:
    automated:
      enabled: true
