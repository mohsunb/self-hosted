apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: server
  namespace: immich
spec:
  parentRefs:
    - name: default
      namespace: kube-system
  hostnames:
    - "immich.test.mohsun.az"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: immich-server
          port: 2283
