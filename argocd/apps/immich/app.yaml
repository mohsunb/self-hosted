apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich-app
  namespace: argocd
spec:
  project: default
  source:
    chart: immich
    repoURL: ghcr.io/immich-app/immich-charts
    targetRevision: 0.13.4
    helm:
      releaseName: immich
      valuesObject:
        controllers:
          main:
            replicas: 2
            strategy: Recreate
            podDisruptionBudget:
              minAvailable: 1
            pod:
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - topologyKey: kubernetes.io/hostname
                      labelSelector:
                        matchLabels:
                          app.kubernetes.io/name: immich
                          app.kubernetes.io/controller: main
            containers:
              main:
                image:
                  tag: v3.3.6
                env:
                  IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'
                  DB_HOSTNAME:
                    valueFrom:
                      secretKeyRef:
                        name: database-app
                        key: host
                  DB_USERNAME:
                    valueFrom:
                      secretKeyRef:
                        name: database-app
                        key: user
                  DB_PASSWORD:
                    valueFrom:
                      secretKeyRef:
                        name: database-app
                        key: password
                  DB_DATABASE_NAME:
                    valueFrom:
                      secretKeyRef:
                        name: database-app
                        key: dbname
                  REDIS_URL:
                    valueFrom:
                      secretKeyRef:
                        name: valkey
                        key: ioredis-url
          machine-learning:
            replicas: 2
            strategy: Recreate
            podDisruptionBudget:
              minAvailable: 1
            pod:
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - topologyKey: kubernetes.io/hostname
                      labelSelector:
                        matchLabels:
                          app.kubernetes.io/name: immich
                          app.kubernetes.io/controller: machine-learning
        immich:
          persistence:
            library:
              existingClaim: library
  destination:
    server: "https://kubernetes.default.svc"
    namespace: immich
  syncPolicy:
    automated:
      enabled: true
