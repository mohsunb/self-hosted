apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: database
  namespace: vaultwarden
spec:
  instances: 2
  storage:
    size: 128Mi
  walStorage:
    size: 128Mi
  affinity:
    podAntiAffinityType: required
  bootstrap:
    initdb:
      database: vaultwarden
      owner: vaultwarden
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: database
  namespace: vaultwarden
spec:
  schedule: "0 */5 * * * *"
  backupOwnerReference: self
  cluster:
    name: database
  method: volumeSnapshot
