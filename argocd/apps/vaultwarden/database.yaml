apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: database
  namespace: vaultwarden
spec:
  instances: 2
  storage:
    size: 128Mi
  walStorage:
    size: 1Gi
  affinity:
    podAntiAffinityType: required
  bootstrap:
    initdb:
      database: vaultwarden
      owner: vaultwarden
