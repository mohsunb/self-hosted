apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: vaultwarden
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: server
      volumes:
        - name: generated
          emptyDir: {}
        - name: config
          configMap:
            name: server
        - name: data
          persistentVolumeClaim:
            claimName: data
      initContainers:
        - name: prepare
          image: docker.io/python:3
          command: ["sh", "/tmp/prepare.sh"]
          env:
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: database-app
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-app
                  key: password
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-app
                  key: host
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: database-app
                  key: dbname
            - name: DATABASE_URL_FILE
              value: /run/secrets/vaultwarden/database-url
          volumeMounts:
            - name: config
              mountPath: /tmp/prepare.sh
              subPath: prepare.sh
              readOnly: true
            - name: generated
              mountPath: /run/secrets/vaultwarden
      containers:
        - name: vaulwarden
          image: docker.io/vaultwarden/server:1.37.5
          env:
            - name: DATABASE_URL_FILE
              value: /run/secrets/vaultwarden/database-url
          volumeMounts:
            - name: generated
              mountPath: /run/secrets/vaultwarden
            - name: data
              mountPath: /data
          ports:
            - containerPort: 80
          startupProbe:
            httpGet:
              path: /alive
              port: 80
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /alive
              port: 80
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
