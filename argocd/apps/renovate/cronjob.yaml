apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
spec:
  schedule: "37 4 * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 10
  successfulJobsHistoryLimit: 1
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          volumes:
            - name: config
              configMap:
                name: renovate
            - name: cache
              persistentVolumeClaim:
                claimName: cache
          containers:
            - name: renovate
              image: docker.io/renovate/renovate:44
              imagePullPolicy: Always
              envFrom:
                - secretRef:
                    name: renovate
              env:
                - name: RENOVATE_REPOSITORY_CACHE
                  value: enabled
                - name: RENOVATE_CACHE_DIR
                  value: /tmp/cache
              volumeMounts:
                - name: config
                  mountPath: /usr/src/app/config.js
                  subPath: config.js
                  readOnly: true
                - name: cache
                  mountPath: /tmp/cache
          restartPolicy: Never
