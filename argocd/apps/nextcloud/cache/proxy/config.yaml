apiVersion: v1
kind: ConfigMap
metadata:
  name: valkey-proxy
  namespace: nextcloud
data:
  haproxy.cfg: |
    global
      maxconn 200

    defaults
      mode tcp
      timeout connect 3s
      timeout client 30s
      timeout server 30s

    resolvers k8s
      parse-resolv-conf
      hold valid  2s

    listen valkey
      bind *:6379
      option tcp-check
      tcp-check connect
      tcp-check send "AUTH ${VALKEY_PASSWORD}\r\n"
      tcp-check expect string +OK
      tcp-check send PING\r\n
      tcp-check expect string +PONG
      tcp-check send "info replication\r\n"
      tcp-check expect string role:master
      tcp-check send QUIT\r\n
      tcp-check expect string +OK
      server valkey-0 valkey-0.valkey-headless:6379 check inter 1s fall 1 rise 1 resolvers k8s init-addr last,libc,none
      server valkey-1 valkey-1.valkey-headless:6379 check inter 1s fall 1 rise 1 resolvers k8s init-addr last,libc,none
