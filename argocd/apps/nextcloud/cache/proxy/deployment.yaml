apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-proxy
  namespace: nextcloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: valkey-proxy
  template:
    metadata:
      labels:
        app: valkey-proxy
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: valkey-proxy
      containers:
        - name: valkey-proxy
          image: forge.mohsun.az/mohsunb/valkey-proxy:0.2.0
          env:
            - name: PRIMARY_INSTANCE_ADDRESS
              value: valkey-0.valkey-headless:6379
            - name: SENTINEL_ADDRESS
              value: valkey-sentinel:26379
            - name: SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey
                  key: password
          ports:
            - name: valkey
              containerPort: 6379
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 3
            periodSeconds: 5
