apiVersion: v1
kind: ConfigMap
metadata:
  name: valkey-sentinel
  namespace: nextcloud
data:
  sentinel.conf.tpl: |
    sentinel resolve-hostnames yes
    sentinel monitor mymaster valkey-0.valkey-headless 6379 2
    sentinel down-after-milliseconds mymaster 1000
    sentinel failover-timeout mymaster 10000
  entrypoint.sh: |
    #!/bin/sh
    set -e

    DATA_DIR="/data"
    CONF_FILE="$DATA_DIR/sentinel.conf"

    if [ -z "$VALKEY_PASSWORD" ]; then
      echo "[entrypoint] password cannot be empty"
      exit 1
    fi

    if [ ! -f "$CONF_FILE" ]; then
      echo "[entrypoint] no persisted config found, bootstrapping from template"
      cp /etc/valkey/sentinel.conf.tpl "$CONF_FILE"
      echo "requirepass $VALKEY_PASSWORD" >> $CONF_FILE
      echo "sentinel auth-pass mymaster $VALKEY_PASSWORD" >> $CONF_FILE
    else
      # clean-up potential corrupted config
      sed -i '/^sentinel known-replica mymaster  6379/d' $CONF_FILE
    fi

    exec valkey-sentinel "$CONF_FILE"
