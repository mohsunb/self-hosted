apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: server
  namespace: nextcloud
spec:
  parentRefs:
    - name: default
      namespace: envoy-gateway-system
  hostnames:
    - "nextcloud.test.mohsun.az"
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: /.well-known/ca(rd|l)dav
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /remote.php/dav/
            statusCode: 301
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: server
          port: 80
