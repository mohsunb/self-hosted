apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: server
  namespace: nextcloud
spec:
  parentRefs:
    - name: default
      namespace: envoy-gateway-system
  hostnames:
    - "nextcloud.test.mohsun.az"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: server
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
      retry:
        attempts: 10
        codes:
          - 500
          - 503
        backoff: 100ms
      timeouts:
        request: 10s
        backendRequest: 5s
