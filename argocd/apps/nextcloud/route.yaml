apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: server
  namespace: nextcloud
spec:
  parentRefs:
    - name: default
      namespace: envoy-gateway-system
  hostnames:
    - "nextcloud.test.mohsun.az"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: server
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
    - matches:
        - path:
            type: RegularExpression
            value: /.well-known/(card|cal)dav
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /remote.php/dav/
            statusCode: 301
