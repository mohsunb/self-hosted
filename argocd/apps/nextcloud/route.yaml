apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: server
  namespace: nextcloud
spec:
  parentRefs:
    - name: default
      namespace: kube-system
  hostnames:
    - "nextcloud.test.isshin-k8s.local"
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: /.well-known/ca(rd|l)dav
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /remote.php/dav/
            statusCode: 301
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: server
          port: 80
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: Strict-Transport-Security
                value: max-age=15552000; includeSubDomains
