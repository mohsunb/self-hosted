apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: database
  namespace: nextcloud
spec:
  backup:
    volumeSnapshot:
      className: nfs-csi
  instances: 2
  storage:
    size: 128Mi
  walStorage:
    size: 128Mi
  affinity:
    podAntiAffinityType: required
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: database
  namespace: nextcloud
spec:
  schedule: "0 */5 * * * *"
  backupOwnerReference: self
  cluster:
    name: database
  method: volumeSnapshot
