apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: nextcloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: server
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
      containers:
        - name: nextcloud
          image: docker.io/nextcloud:34.0.1
          env:
            - name: REDIS_HOST
              value: valkey-proxy
            - name: REDIS_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey
                  key: password
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: nextcloud.test.mohsun.az
          volumeMounts:
            - name: data
              mountPath: /var/www/html
          ports:
            - containerPort: 80
