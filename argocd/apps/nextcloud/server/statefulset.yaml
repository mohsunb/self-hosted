apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: server
  namespace: nextcloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: server
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: config
          configMap:
            name: server
      initContainers:
        - name: k8s-config
          image: docker.io/bash:5
          command: ["sh", "/tmp/init.sh"]
          volumeMounts:
            - name: data
              mountPath: /var/www/html
            - name: config
              mountPath: /tmp/zz-kubernetes.config.php
              subPath: zz-kubernetes.config.php
              readOnly: true
            - name: config
              mountPath: /tmp/init.sh
              subPath: init.sh
              readOnly: true
      containers:
        - name: nextcloud
          image: docker.io/nextcloud:34.0.1
          env:
            - name: REDIS_HOST
              value: valkey-proxy
            - name: REDIS_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey
                  key: password
            - name: SERVER_HOST
              value: nextcloud.test.mohsun.az
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: database-app
                  key: host
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: database-app
                  key: dbname
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: database-app
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-app
                  key: password
            - name: NEXTCLOUD_ADMIN_USER
              value: admin
            - name: NEXTCLOUD_ADMIN_PASSWORD
              value: admin
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: nextcloud.test.mohsun.az
          volumeMounts:
            - name: data
              mountPath: /var/www/html
          ports:
            - containerPort: 80
          startupProbe:
            httpGet:
              path: /heartbeat
              port: 80
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /heartbeat
              port: 80
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
