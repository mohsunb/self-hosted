apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: fmd
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: server
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
      containers:
        - name: fmd-server
          image: registry.gitlab.com/fmd-foss/fmd-server:0.17.1
          volumeMounts:
            - name: data
              mountPath: /var/lib/fmd-server/db
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
