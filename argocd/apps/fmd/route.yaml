apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: server
  namespace: fmd
spec:
  parentRefs:
    - name: default
      namespace: kube-system
  hostnames:
    - "fmd.test.mohsun.az"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: server
          port: 8080
