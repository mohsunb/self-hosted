apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-app
  namespace: argocd
spec:
  project: default
  source:
    chart: gateway-helm
    repoURL: docker.io/envoyproxy
    targetRevision: 1.8.2
    helm:
      releaseName: eg
  destination:
    server: "https://kubernetes.default.svc"
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      enabled: true
