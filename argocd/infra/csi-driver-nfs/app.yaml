apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: csi-driver-nfs-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-csi.github.io/csi-driver-nfs
    chart: csi-driver-nfs
    targetRevision: 4.13.6
    helm:
      releaseName: csi-driver-nfs
      valuesObject:
        controller:
          replicas: 2
          affinity:
            # this is unnecessary (a bug with the template)
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/os
                        operator: In
                        values:
                          - linux
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app: csi-nfs-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      enabled: true
