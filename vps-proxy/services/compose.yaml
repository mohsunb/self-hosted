volumes:
  caddy_data:
  caddy_config:
  ntfy-message-cache:

services:
  caddy:
    image: docker.io/caddy:2.11.4
    container_name: caddy
    restart: unless-stopped
    ports:
      - "1080:80"
      - "1443:443"
      - "1443:443/udp"
    volumes:
      - ./data/caddy/conf:/etc/caddy:Z
      - ./data/caddy/site:/srv:Z
      - ./log/caddy:/var/log/caddy:Z
      - caddy_data:/data:Z
      - caddy_config:/config:Z

  ntfy:
    image: docker.io/binwiederhier/ntfy:v2.26.0
    container_name: ntfy
    command:
      - serve
    volumes:
      - ntfy-message-cache:/var/cache/ntfy:Z
      - ./data/ntfy:/etc/ntfy:Z
    healthcheck: # optional: remember to adapt the host:port to your environment
        test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
        interval: 60s
        timeout: 10s
        retries: 3
        start_period: 40s
    restart: unless-stopped
    init: true # needed, if healthcheck is used. Prevents zombie processes

  uptime-kuma:
    image: docker.io/louislam/uptime-kuma:2.5.0
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ./data/uptime-kuma:/app/data:Z
    extra_hosts:
      - "push.mohsun.az:host-gateway"
      - "forge.mohsun.az:host-gateway"
      - "vault.mohsun.az:192.168.3.2"
      - "gallery.mohsun.az:host-gateway"
      - "sync.mohsun.az:host-gateway"
      - "track.mohsun.az:host-gateway"
      - "tunnel.mohsun.az:host-gateway"

  headscale:
    image: docker.io/headscale/headscale:v0.29.2
    restart: unless-stopped
    container_name: headscale
    read_only: true
    tmpfs:
      - /var/run/headscale
    ports:
      - "3478:3478/udp"
    volumes:
      - ./data/headscale/config:/etc/headscale:Z,ro
      - ./data/headscale/lib:/var/lib/headscale:Z
    command: serve
    healthcheck:
        test: ["CMD", "headscale", "health"]
